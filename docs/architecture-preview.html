<!doctype html>
<!--
  Local preview for architecture.svg.

  Open this file in a browser to watch the animation:
      xdg-open docs/architecture-preview.html

  The SVG is embedded with <img>, which is how GitHub renders it in the
  README — so what you see here is what a reader sees there. CSS animations
  inside an SVG do run when it is loaded this way; only scripts are blocked.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cloud Armor demo — architecture</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0d1117;
      font-family: "DejaVu Sans", Arial, sans-serif;
      color: #8b949e;
    }
    figure { margin: 0; padding: 24px; }
    img { width: min(1280px, 94vw); height: auto; display: block; }
    figcaption { margin-top: 14px; font-size: 13px; text-align: center; }
    code { color: #e6edf3; }
  </style>
</head>
<body>
  <figure>
    <img src="architecture.svg" alt="Animated Cloud Armor architecture diagram">
    <figcaption>12-second loop &middot; reload to restart &middot; source: <code>docs/architecture.svg</code></figcaption>
  </figure>
</body>
</html>
